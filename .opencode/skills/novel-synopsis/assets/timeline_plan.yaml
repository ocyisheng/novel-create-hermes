# 时间线设计模板 v1.0
# outline/时间线设计.yaml — 创作前：全局时间线设计
# 由 novel-outline 技能在 P4（总纲撰写）阶段创建和维护
# 是"写前设计"文件，不属于追踪目录
#
# 与追踪文件的区别：
#   - 规划文件（本文件）：按时代/阶段分组的结构化世界年表
#   - 追踪文件（outline/追踪/时间线.yaml）：按章节追加的扁平事件日志
#   规划文件的事件是"设计意图"，追踪文件的事件是"实际写入内容"

版本: "1.0"
设计说明: ""                         # 基于总纲和世界背景设计的故事时间线说明
纪年体系: ""                         # 故事世界的纪年体系名称，如 "致历" / "公元" / "星历"

时间线设计:
  - 时代: ""                         # 时代/阶段名称，如 "远古时期"、"主角时代"
    说明: ""                         # 该时代的整体说明
    事件:
      - 时间: ""                     # 时间点或范围，如 "上古"、"致历0年"
        事件: ""                     # 事件描述
        备注: ""                     # 可选的补充说明

  # 示例（使用时可删除）：
  # - 时代: "远古时期"
  #   说明: "魔界入侵、上古天庭、飞升台建造"
  #   事件:
  #     - 时间: "上古"
  #       事件: "魔界入侵人界，真魔降临"
  #     - 时间: "上古"
  #       事件: "古修士封印真魔气，对飞升通道造成结构性损伤"
  #
  # - 时代: "主线时期"
  #   说明: "从主角出生到结局"
  #   事件:
  #     - 时间: "故事第0年"
  #       事件: "主角出生"
  #     - 时间: "8岁"
  #       事件: "主角被判定为绝灵根，离家学医"
