unit_type: character_arc
description: "角色弧线：角色跨章节的成长轨迹"

content_schema:
  events:
    type: array
    description: "角色事件序列"
    items:
      type: object
      properties:
        ordinal:  { type: number, description: "事件序数" }
        age:      { type: number, nullable: true, description: "年龄" }
        realm:    { type: string, nullable: true, description: "修为等级" }
        location: { type: string, description: "地点名称" }
        type:     { type: string, description: "事件分类（修炼/战斗/废功）" }
  end_state:
    type: string
    nullable: true
    description: "卷末状态描述"
  personality:
    type: string
    nullable: true
    description: "性格概要"
  goal:
    type: string
    nullable: true
    description: "当前目标"
  background:
    type: string
    nullable: true
    description: "背景设定"

fact_fields:
  - name: "age_events"
    path: "events[].age"
    type: temporal_sequence
    ordering: "events[].ordinal"
    description: "年龄时间序列"
  - name: "realm_events"
    path: "events[].realm"
    type: temporal_sequence
    ordering: "events[].ordinal"
    description: "修为等级时间序列"
  - name: "location_refs"
    path: "events[].location"
    type: entity_reference
    target_type: world_rule
    match_field: unit_name
    description: "事件地点引用"
  - name: "ending_state"
    path: "end_state"
    type: scalar
    description: "角色卷末状态"

constraints:
  - id: age_monotonic
    category: temporal
    severity: warning
    description: "角色年龄必须随事件序数单调递增"
    fact_field: "age_events"
    check: monotonic_increasing
    exceptions:
      field: "events[].type"
      values: ["废功", "散功", "转世"]

  - id: realm_monotonic
    category: temporal
    severity: warning
    description: "角色修为等级应随序数递增（除非有废功事件标注）"
    fact_field: "realm_events"
    check: monotonic_increasing
    exceptions:
      field: "events[].type"
      values: ["废功", "散功", "转世"]

  - id: location_exists
    category: referential_integrity
    severity: warning
    description: "角色事件表中的位置必须在 world_rule 中有对应条目"
    fact_field: "location_refs"

  - id: archived_no_participate
    category: state_conservation
    severity: warning
    description: "已归档角色不应继续通过 PARTICIPATES_IN 出现在场景中"
    state_field: "status"
    forbidden_relation: "participates_in"
    allowed_exception_values: ["flashback", "回忆", "梦境"]

  - id: has_min_relations
    category: cardinality
    severity: info
    description: "角色至少应关联一个场景"
    relation_type: "participates_in"
    min_count: 1

relations:
  allowed:
    participates_in:
      target_type: [scene]
      cardinality: any
      description: "角色参与场景"
      payload_schema:
        role:
          type: string
          nullable: true
          description: "角色在该场景中的戏份定位（主角/配角/客串）"
        entry_state:
          type: string
          nullable: true
          description: "入场状态描述（如'筑基后期'）"
        exit_state:
          type: string
          nullable: true
          description: "退场状态描述"
        screen_time:
          type: number
          nullable: true
          description: "戏份权重（0.0-1.0）"
        entry_ordinal:
          type: number
          nullable: true
          description: "出场序数（在该场景事件时间线中的位置）"
      payload_constraints:
        - id: entry_state_not_null
          category: boundary
          severity: info
          description: "重要角色应有入场状态标注"
          field: "entry_state"
          check: field_not_null

    located_at:
      target_type: [world_rule]
      cardinality: "0..n"
      description: "角色当前所在地点"
      payload_schema:
        since_ordinal:
          type: number
          nullable: true
          description: "从该序数开始驻留"
        until_ordinal:
          type: number
          nullable: true
          description: "直到该序数离开"
        reason:
          type: string
          nullable: true
          description: "驻留原因"
      payload_constraints:
        - id: since_before_until
          category: temporal
          severity: warning
          description: "驻留起始序数应早于结束序数"
          fields: ["since_ordinal", "until_ordinal"]
          check: field_a_lt_field_b
          skip_when_null: true

    allied_with:
      target_type: [character_arc]
      cardinality: any
      bidirectional: true
      description: "角色之间的同盟关系"
      payload_schema:
        relation_label:
          type: string
          nullable: true
          description: "关系标签（师徒/盟友/仇敌/夫妻）"
        intensity:
          type: number
          nullable: true
          description: "关系强度 0.0-1.0"
        since_ordinal:
          type: number
          nullable: true
          description: "关系开始的序数"
        until_ordinal:
          type: number
          nullable: true
          description: "关系结束的序数"
      payload_constraints:
        - id: allied_since_before_until
          category: temporal
          severity: info
          description: "关系开始序数应早于结束序数"
          fields: ["since_ordinal", "until_ordinal"]
          check: field_a_lt_field_b
          skip_when_null: true

    member_of:
      target_type: [world_rule]
      cardinality: "0..n"
      description: "角色所属组织/势力"
      payload_schema:
        role:
          type: string
          nullable: true
          description: "在该组织中的职务"
        joined_at:
          type: object
          nullable: true
          properties:
            ordinal: { type: number, description: "加入序数" }
            chapter: { type: number, nullable: true }
            label:   { type: string, nullable: true, description: "加入场景" }
        left_at:
          type: object
          nullable: true
          properties:
            ordinal: { type: number }
            chapter: { type: number, nullable: true }
            reason:  { type: string, nullable: true, description: "离开原因" }
      payload_constraints:
        - id: join_before_leave
          category: temporal
          severity: warning
          description: "加入序数应早于离开序数"
          fields: ["joined_at.ordinal", "left_at.ordinal"]
          check: field_a_lt_field_b
          skip_when_null: true

    possesses:
      target_type: [world_rule]
      cardinality: "0..n"
      description: "角色拥有的物品/能力/法宝"
      payload_schema:
        acquired_at:
          type: object
          nullable: true
          properties:
            ordinal:  { type: number, description: "获取序数" }
            chapter:  { type: number, nullable: true }
            label:    { type: string, nullable: true, description: "获取场景" }
        upgrades:
          type: array
          nullable: true
          description: "升级记录"
          items:
            type: object
            properties:
              ordinal:  { type: number, description: "升级序数" }
              new_name: { type: string, description: "升级后的名称" }
              event:    { type: string, nullable: true, description: "升级方式" }
        lost_at:
          type: object
          nullable: true
          properties:
            ordinal: { type: number, description: "丢失序数" }
            chapter: { type: number, nullable: true }
            cause:   { type: string, nullable: true, description: "丢失原因" }
      payload_constraints:
        - id: acquired_before_lost
          category: temporal
          severity: warning
          description: "获取序数应早于丢失序数"
          fields: ["acquired_at.ordinal", "lost_at.ordinal"]
          check: field_a_lt_field_b
          skip_when_null: true
        - id: upgrade_ordinal_ascending
          category: temporal
          severity: info
          description: "升级记录序数应递增"
          fields: ["upgrades"]
          check: monotonic_increasing

    references:
      target_type: ["*"]
      cardinality: any
      description: "角色引用其他单元"
  forbidden_when:
    - relation_type: participates_in
      condition:
        field: "status"
        eq: "archived"

state_machine:
  initial: sprout
  transitions:
    sprout:  [{ to_status: growing }]
    growing: [{ to_status: mature }, { to_status: frozen }]
    mature:  [{ to_status: growing }, { to_status: frozen }]
    frozen:  [{ to_status: growing }]
    archived: []
