style_name: "通俗网文风"
description: "轻松口语化的网文叙事，快节奏高爽感，代入感强"
category: "网文"
dimensions:
  narrative_tone:
    description: "第三人称有限，偶尔切换内心吐槽，轻松幽默"
    keywords: ["轻松", "代入", "爽感"]
  sentence_structure:
    description: "短句为主，口语化断句，短段多见"
    avg_sentence_length: "short"
    characteristics: ["口语化断句", "段落短", "感叹号多见"]
  pacing:
    description: "升级打脸快节奏，装逼桥段迭起"
    pattern: "小冲突 + 打脸 + 升级循环"
  dialogue_style:
    description: "口语化对白，信息量适中，时有搞笑"
    attribution_pattern: "简单标签：说、道、问"
    speech_patterns: ["口语化", "简短", "有梗"]
  vocabulary_register:
    description: "日常口语，少量网文术语"
    register_level: "colloquial"
    distinctive_vocab: ["稳了", "大佬", "爽"]
    forbidden_vocab: ["古文辞藻", "学术术语", "文艺腔"]
  rhetorical_features:
    description: "少用修辞，强调情绪直给"
    devices: ["夸张", "对比"]
  forbidden_patterns:
    patterns: ["长篇心理描写", "环境烘托过度", "文绉绉对话"]