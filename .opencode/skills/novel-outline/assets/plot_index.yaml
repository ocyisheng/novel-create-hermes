# 情节线主索引模板 v1.0
# 由 generate_plot_index.py 自动生成框架，人工补充节奏总览和交汇注释。
# rebuild_project_index.py 不索引此文件（手动编辑优先）。
#
# 四表结构：
#   表一 目录        — 脚本生成，无需人工编辑
#   表二 线速览      — 脚本生成，人工可覆写
#   表三 多线交织总图 — 脚本检测交汇章节，人工补充注释和优先级
#   表四 节奏总览    — 完全人工规划

_meta:
  entity_type: "plot_index"
  schema_version: "1.0"
  generated_at: ""           # ISO 时间戳，脚本生成时填写
  last_curated_at: ""        # ISO 时间戳，最后人工编辑时间
  project_total_chapters: 0  # 从 config.yaml 读取

# ═══════════════════════════════════════════════
# 表一：目录（脚本生成，无需人工编辑）
# ═══════════════════════════════════════════════
目录:
  主线: "主线.yaml"
  支线: []                   # [{文件, 实体ID}, ...] 脚本自动填充

# ═══════════════════════════════════════════════
# 表二：线速览（脚本生成，人工可覆写）
# ═══════════════════════════════════════════════
线速览:
  主线:
    类型: ""                 # 从 完整档案.类型 读取
    覆盖: ""                 # 从 索引信息.起始章节 → config.目标章节数 计算
    核心冲突: ""             # 从 完整档案.冲突核心 读取
    角色: []                 # 从 完整档案.角色参与.涉及角色 读取
    # ── 每条支线同样格式，脚本自动填充 ──

# ═══════════════════════════════════════════════
# 表三：多线交织总图（脚本检测 + 人工补充）
# ═══════════════════════════════════════════════
多线交织总图:
  # 每条交汇点格式:
  - 章节范围: ""             # 如 "第232-234章"
    涉及线: []               # 脚本自动列出
    涉及线数量: 0            # 脚本自动计算
    自动检测依据: []         # [{情节线名, 事件描述, 章节号}]
    内容: ""                 # ← 人工填写：交汇内容描述
    优先级: ""               # ← 人工标注：high / medium / low
    状态: ""                 # 脚本标注：已发生 / 待发生（vs 情节线.当前章节位置）

# ═══════════════════════════════════════════════
# 表四：节奏总览（完全人工规划）
# ═══════════════════════════════════════════════
节奏总览:
  # 每个创作阶段由人工定义阶段名、卷范围、各线程角色分配
  # 格式:
  # 阶段标识:
  #   阶段名: ""
  #   卷范围: ""
  #   主导线: []     # 本阶段的核心叙事焦点
  #   辅助线: []     # 配合主线推进的次要叙事
  #   暗线: []       # 在背景中渐进发展的隐线
  #   搁置: []       # 本阶段不活跃的线
  #   节奏特征: ""   # 人工描述，如 "紧张——多条线同时收紧"
