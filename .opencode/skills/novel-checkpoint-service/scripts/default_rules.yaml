# ===========================================================================
# default_rules.yaml — novel-checkpoint-service 内置默认规则
# ===========================================================================
# 项目级 config.yaml 可覆盖此文件中的同名检查点。
# 注意：writing_after_outline 为硬编码强制暂停，不受项目覆盖影响。
# 覆盖格式（在 config.yaml 中）：
#   checkpoint_rules:
#     ideation_after_concept:
#       high: continue     # 覆盖内置的 pause → continue
# ===========================================================================

default: "continue"

# 三档干预等级设计：
#   low    — 快速创作：仅大纲完成后暂停（安全门），其余自动执行
#   medium — 推荐模式：关键决策点暂停（创意方向 + 大纲确认 + 质量总评）
#   high   — 新手/重项目：每个子步骤都需确认（角色/世界观/情节/每章/每次检测）

checkpoints:

  # ===== Ideation =====
  ideation_after_concept:
    low: continue
    medium: pause
    high: pause
  ideation_after_template:
    low: continue
    medium: pause
    high: pause

  # ===== Writing (大纲阶段) =====
  writing_after_outline:
    low: pause          # 唯一强制暂停点，所有等级都停
    medium: pause
    high: pause
  writing_after_character:
    low: continue
    medium: continue
    high: pause
  writing_after_worldview:
    low: continue
    medium: continue
    high: pause
  writing_after_plot:
    low: continue
    medium: continue
    high: pause

  # ===== Writing (章节写作) =====
  writing_after_chapters:
    low: continue       # low: 自动连续写
    medium: continue    # medium: 自动连续写
    high: pause         # high: 每章写完暂停确认

  # ===== Quality（质量检测） =====
  quality_after_plot_check:
    low: continue
    medium: continue
    high: pause
  quality_after_character_check:
    low: continue
    medium: continue
    high: pause
  quality_after_worldview_check:
    low: continue
    medium: continue
    high: pause
  quality_after_full_evaluation:
    low: continue
    medium: pause
    high: pause
  quality_after_pacing:
    low: continue
    medium: continue
    high: pause

  # ===== Quality（自动修复/反馈） =====
  quality_after_feedback:
    low: continue
    medium: auto_fix
    high: pause

  # ===== Project（项目管理） =====
  project_after_new:
    low: continue
    medium: continue
    high: pause
  project_after_import:
    low: continue
    medium: continue
    high: pause
