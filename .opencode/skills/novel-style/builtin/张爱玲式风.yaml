style_name: "张爱玲式风"
description: "张爱玲式冷艳叙事，机锋暗藏，感官锋锐，华丽而苍凉"
category: "近现代"
dimensions:
  narrative_tone:
    description: "第三人称冷眼旁观，时而贴近时而疏离，机锋与苍凉交织"
    keywords: ["冷艳", "机锋", "感官", "苍凉"]
    example: "她穿着那件旗袍，站在镜子前，觉得自己像一幅画。"
  sentence_structure:
    description: "长短对比强烈，短句如刃长句如绸，节奏精准"
    avg_sentence_length: "mixed"
    characteristics: ["长短对比强", "节奏精准", "警句频出"]
    example: "她穿着那件旗袍。站在镜子前。觉得自己像一幅画。"
  pacing:
    description: "衣饰器物精描如工笔，心理转折一句刺穿"
    pattern: "物象精描 → 人心洞察 → 利落收束"
    example: "【物象】衣饰器物精描（3-5句）→【人心】心理转折一句刺穿→【收束】利落结尾"
  dialogue_style:
    description: "话中有话机锋暗藏，调情与算计都在字里行间"
    attribution_pattern: "笑道、低声道等细腻神态前置"
    speech_patterns: ["机锋暗藏", "算计", "话里有话"]
    example: "你来了。我来了。你走吧。好。"
  vocabulary_register:
    description: "华丽精准，色彩感极强，感官词汇丰富"
    register_level: "literary"
    distinctive_vocab: ["苍凉", "华丽", "惘惘的", "参差"]
    forbidden_vocab: ["直白抒情", "朴素白描", "豪放粗犷"]
  rhetorical_features:
    description: "奇喻（不相干事物的精准类比），对照，通感"
    devices: ["奇喻", "对照", "通感", "警句"]
  forbidden_patterns:
    patterns: ["直白说理", "天真浪漫", "男性粗犷叙事"]