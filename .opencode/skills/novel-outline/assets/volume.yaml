# 分卷大纲模板 v2.0
# 单卷完整大纲 — 元文档，不参与三层索引
# 用于 P3 分卷大纲生成，每卷独立文件
# 无需 _meta/索引信息/摘要（非实体，Agent 手动 read）

# ═══════════════════════════════════════════
# 一、卷信息
# ═══════════════════════════════════════════
卷信息:
  卷号: "卷1"                            # 如 "卷1", "卷2"
  卷名: ""                                # 如 "惊雷初醒·惊变"
  所属阶段: ""                            # 对应故事结构阶段，如 "阶段一：救亡图存"
  章节范围: ""                            # 如 "第1章 - 第30章（共30章）"
  时间跨度: ""                            # 如 "263年9月（约30天）"
  核心冲突: ""                            # ≤50字，本卷核心矛盾

# ═══════════════════════════════════════════
# 二、叙事任务
# 本卷必须完成的叙事目标，3-5条
# ═══════════════════════════════════════════
叙事任务:
  - ""                                    # 例: "建立主角的双重身份认同"
  - ""                                    # 例: "完成第一场政治胜利"
  - ""                                    # 例: "建立第一批可信的盟友关系"

# ═══════════════════════════════════════════
# 三、主角状态
# ═══════════════════════════════════════════
主角状态:
  起点: ""                                # 卷初主角的状态/等级/心境
  终点: ""                                # 卷末主角的状态/等级/心境
  年龄: ""                                # 本卷结束时主角年龄

# ═══════════════════════════════════════════
# 四、微弧分割
# 2-4个微弧，每弧包含章节范围、核心事件、高潮
# ═══════════════════════════════════════════
微弧分割:
  - 微弧名: ""                            # 如 "穿越初醒"
    章节: ""                              # 如 "第1-11章"
    核心事件:
      - ""                                # 逐章事件描述
      - ""
      - ""
    高潮: ""                              # 本微弧的高潮章节及内容

  - 微弧名: ""
    章节: ""
    核心事件:
      - ""
    高潮: ""

# ═══════════════════════════════════════════
# 五、POV 分布
# ═══════════════════════════════════════════
POV分布:
  主视角范围: ""                          # 如 "第1-25章"
  POV角色列表:
    - 角色: ""                            # 角色名
      类型: ""                            # 盟友/敌方/中立/小人物
      章节: ""                            # 如 "第7-8章"
      功能: ""                            # 该角色视角在本卷中的作用

# ═══════════════════════════════════════════
# 六、间奏章节
# 非推进主线的特殊章节：回忆/风景/情感/战场间隙
# ═══════════════════════════════════════════
间奏章节:
  - 章号: ""                              # 如 "第12章*"（*标记非推进）
    类型: ""                              # 回忆/风景/情感/战场间隙
    内容: ""                              # 简要描述

# ═══════════════════════════════════════════
# 七、关键事件清单
# 按类型分类，便于后续写作时查表
# ═══════════════════════════════════════════
关键事件清单:
  军事/战斗: []
  政治/朝堂: []
  经济/建设: []
  情报/外交: []
  # 按项目需要可扩展其他分类

# ═══════════════════════════════════════════
# 八、角色发展
# 本卷内每个角色的弧线
# ═══════════════════════════════════════════
角色发展:
  - 角色: ""                              # 角色名
    弧线: ""                              # 本卷内的变化弧线

# ═══════════════════════════════════════════
# 九、本卷节奏
# ═══════════════════════════════════════════
本卷节奏:
  整体基调: ""                            # 如 "压抑焦灼" / "热血悲壮"
  情感曲线: ""                            # 如 "绝望→震惊→冷静→一线希望"

# ═══════════════════════════════════════════
# 十、卷末钩子
# 下卷的悬念钩子
# ═══════════════════════════════════════════
卷末钩子: ""                              # 如 "邓艾的三万精锐已翻越阴平——留给主角的时间不多了"
