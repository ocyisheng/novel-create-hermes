style_name: "新派武侠风"
description: "新派武侠叙事，文白兼具现代感，意境与动作并重，人物立体多面"
category: "武侠"
dimensions:
  narrative_tone:
    description: "第三人称有限为主，既有古典韵味又有现代心理刻画"
    keywords: ["融合", "立体", "意境", "成长"]
  sentence_structure:
    description: "长短灵活切换，打斗用短句营造速度，抒情用长句渲染意境"
    avg_sentence_length: "mixed"
    characteristics: ["长短灵活", "打斗短句", "意境长句"]
  pacing:
    description: "打斗有节奏感（起承转合），情感转折细写，境界提升做高潮"
    pattern: "江湖冲突 → 内心挣扎 → 境界突破 → 道义抉择"
  dialogue_style:
    description: "融合金庸的典雅和古龙的锋利，人物各有腔调"
    attribution_pattern: "适时切换，气氛紧张时用极简标签"
    speech_patterns: ["身份分明", "文白适度", "哲思点缀"]
  vocabulary_register:
    description: "文白适度融合，现代词汇适度出现，不突兀"
    register_level: "mixed"
    distinctive_vocab: ["道心", "领悟", "破境", "执念", "缘法"]
    forbidden_vocab: ["纯现代口语", "网游术语", "体系表格化"]
  rhetorical_features:
    description: "比喻和对比为主，打斗中的留白和余韵"
    devices: ["比喻", "对比", "象征", "留白"]
  forbidden_patterns:
    patterns: ["数据化战力", "套路化打脸", "单薄的脸谱化角色"]