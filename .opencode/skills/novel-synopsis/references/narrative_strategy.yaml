# P4.5 叙事策略模板
#
# 本文件是 P4.5 叙事策略设计阶段的输出模板。
# 编排层在 P4（总纲）完成后、P5（情节构建）之前调用此模板。
# 输出保存为 outline/叙事策略.yaml，供 P5-P8 消费。
#
# Usage:
#   P4.5 阶段由 novel-outline 技能生成此文件。
#   P5-P8 通过 chapter_context.py 或直接 read 消费此文件。

叙事策略:
  # ── 视角管理 ──────────────────────────────────────────────────────
  视角选择:
    # 主视角类型：第一人称 / 第三人称限制 / 第三人称全知 / 客观视角
    主视角: "第三人称限制"

    # 主视角锚定角色（第三人称限制时必填）
    主视角角色: ""

    # 辅助视角（可选，用于多视角叙事）
    辅助视角:
      - 角色: ""
        功能: ""  # 如"提供反派视角"、"补充主角不在场的信息"
        使用频率: ""  # 如"每卷 2-3 章"

    # 视角切换规则
    切换规则:
      每章最多切换次数: 2
      切换方式: "场景分隔"  # 场景分隔 / 章节分隔
      禁止行为: "同一场景内切换视角"

  # ── 叙事手法 ──────────────────────────────────────────────────────
  叙事手法:
    # 主要叙事手法：顺序 / 倒叙 / 插叙 / 多线并行
    主要手法: "顺序叙事"

    # 辅助叙事手法（可选）
    辅助手法:
      - 手法: "闪回"
        使用场景: "角色背景揭示"
        频率限制: "每卷不超过 3 次"
        标记方式: "通过场景分隔 + 时间标记"

      - 手法: "闪前"
        使用场景: "悬念营造"
        频率限制: "每卷不超过 2 次"
        标记方式: "通过场景分隔 + 模糊化处理"

    # 禁忌手法
    禁忌手法:
      - "不可靠叙事"  # 网文慎用，读者期待明确信息
      - "意识流"      # 网文阅读习惯不支持

  # ── 信息分配 ──────────────────────────────────────────────────────
  信息分配:
    # 戏剧反讽（读者知道角色不知道的信息）
    戏剧反讽:
      启用: true
      使用场景: "反派阴谋揭示、配角秘密"
      标注方式: "在分纲中标注 [读者优势]"
      限制: "每卷不超过 5 处"

    # 悬疑管理
    悬疑管理:
      每卷主要悬念数量: 3
      悬念解答周期: "2-3 卷"
      章节钩子: "每章结尾必须有下一步行动的暗示"

    # 误导策略
    误导策略:
      启用: true
      使用场景: "通过角色视角限制制造误解"
      揭示方式: "后期通过其他视角或事件揭示真相"
      限制: "误导必须有合理解释，不能为了反转而反转"

  # ── 展示与讲述 ──────────────────────────────────────────────────────
  展示与讲述:
    # 展示优先的场景类型
    展示优先:
      - "情感高潮"
      - "动作场景"
      - "角色转变时刻"
      - "世界观首次展现"

    # 讲述适用的场景类型
    讲述适用:
      - "背景交代"
      - "时间跳跃"
      - "过渡段落"
      - "次要情节概括"

    # 比例建议
    比例建议:
      展示: 70
      讲述: 30

    # 判断标准
    判断标准:
      展示: "通过动作、对话、感官描写呈现"
      讲述: "通过叙述者概括、角色内心独白呈现"

  # ── 笔法控制 ──────────────────────────────────────────────────────
  笔法控制:
    # 冷笔场景
    冷笔场景:
      - "动作场景"
      - "紧张时刻"
      - "信息传递"
      - "章节开头"

    # 热笔场景
    热笔场景:
      - "情感高潮"
      - "内心独白"
      - "氛围营造"
      - "角色回忆"

    # 切换规则
    切换规则:
      - "冷→热：通过情感触发事件（回忆、感悟）切换"
      - "热→冷：通过动作/对话打断情感，切换到客观叙述"
      - "禁止：连续 3 段以上同一笔法无变化"
