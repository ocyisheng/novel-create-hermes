# 创作决策压力测试评估报告模板
# 输出路径: quality/grill/{测试阶段}_{YYYYMMDD_HHmmss}.yaml

项目名: "{项目名}"
测试阶段: "{测试阶段}"  # ideation / outline / character / chapter
测试时间: "{时间戳}"

测试对象:
  概要: "{测试对象概要}"
  路径: "{测试对象路径}"

评估结果:
  优势:
    - "优势1：..."
    - "优势2：..."
  风险:
    - "风险1：..."
    - "风险2：..."
  改进建议:
    - "建议1：..."
    - "建议2：..."

综合评分: 0-10  # 0=完全不可行，10=完美

用户决策: "接受 / 修改后重来"
