# 角色档案模板 v3.0.0
# 三层结构：_meta + 索引信息 + 摘要 + 完整档案
# 模板结构：索引信息 + 摘要 + 完整档案
#
# YAML 格式规则（必须遵守）：
#   1. 统一 2 空格缩进，禁止 tab
#   2. 所有字符串值必须用双引号包裹
#   3. 多段落文本字段（标注 | 的字段）：使用 YAML literal block scalar
#      格式为 `字段名: |`，下一行起正文比字段名多缩进 2 空格，段落间保留空行
#   4. 列表项（-）比父级键多缩进 2 空格

_meta:
  entity_type: "character"            # 固定值
  schema_version: "3.0"               # 契约版本
  created_at: ""                      # ISO 时间戳，生成时填写
  updated_at: ""                      # ISO 时间戳，修改时更新

# ═══════════════════════════════════════════
# Layer 1: 索引层 (必填)
# ═══════════════════════════════════════════
索引信息:
  实体ID: ""                           # 唯一标识，如 "linmo"，用于索引键
  名称: ""                             # 显示名
  角色类型: ""                         # 主角/反派/导师/盟友/对手/次要角色
  势力: ""                             # 所属势力/阵营，如 落云宗、黄枫谷、鬼道、孙家
  状态: "active"                       # active / inactive / deceased / departed
  首次出场章节: 0                      # 首次出现的章节号（规划）

# ═══════════════════════════════════════════
# Layer 2: 摘要层 (必填)
# ═══════════════════════════════════════════
摘要:
  一句话描述: ""                       # ≤30 字
  当前境况: ""                         # ≤50 字，当前情节位置
  核心特质: []                         # ≤5 个关键词
  当前目标: ""                         # 当前章节中的目标
  关键关系: []                         # 本章涉及的关键人物关系

# ═══════════════════════════════════════════
# Layer 3: 完整档案 (可留空)
# ═══════════════════════════════════════════
完整档案:
  基本信息:
    性别: ""
    年龄: 0                             # 初始年龄（故事开始时）
    出生时间: ""                         # 故事世界中的出生时间，如 "致历0年" / "245年"
    死亡时间: ""                         # 故事世界中的死亡时间（如适用）
    身份: ""
    外貌:
      身高: ""
      体型: ""
      特征: ""
      习惯动作: []
      服饰风格: ""
  性格:
    核心特质: ""
    优点: []
    缺点: []
    价值观: ""
    口头禅: ""
    语气风格: ""
  背景:
    出身: ""
    成长经历: |
      （多段落正文,直达核心简洁描述。每段比键名多 2 空格缩进）

      （段落间空行同样缩进）
    关键事件:
      - "事件描述（短句）"
      - "事件描述（短句）"
    心理创伤: |
      （多段落正文，同上）
    动机根源: |
      （多段落正文，同上）
  目标与冲突:
    公开目标: ""
    隐藏目标: ""
    内心渴望: ""
    核心恐惧: ""
    主要障碍: []
  能力设定:
    技能专长: []
    天生才能: []
    能力限制: []
    成长潜力: ""
  关系网络:
    家人:
      - 角色: ""
        关系类型: ""
        关系状态: ""
        关键事件: ""
    师门:
      - 角色: ""
        关系类型: ""
        关系状态: ""
        关键事件: ""
    朋友:
      - 角色: ""
        关系类型: ""
        关系状态: ""
        关键事件: ""
    敌人:
      - 角色: ""
        关系类型: ""
        关系状态: ""
        关键事件: ""
    恋人:
      - 角色: ""
        关系类型: ""
        关系状态: ""
        关键事件: ""
    其他关系: []
  角色弧线:
    起始状态: ""
    成长阶段:
      - "阶段描述"
      - "阶段描述"
    关键转变: |
      （多段落正文,直达核心简洁描述）
    最终状态: |
      （多段落正文,直达核心简洁描述）
    弧线完整性: "完整"                 # 完整/部分/未开始
  与主线关系:
    主线参与度: ""                     # 核心/重要/次要/背景
    对主线影响: ""
    主线对其影响: ""
  创作笔记:
    注意事项: |
      （多段落正文）
    避免踩坑:
      - "注意事项"
      - "注意事项"
    扩展建议: |
      （多段落正文）
