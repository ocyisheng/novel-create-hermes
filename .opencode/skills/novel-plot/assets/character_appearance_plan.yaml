# 角色出场规划模板 v1.0
# outline/角色出场规划.yaml — 创作前：角色出场预期分布（可选）
# 由 novel-entity 或 novel-outline 技能在 P3/P5 阶段创建
# 是"写前设计"文件，不属于追踪目录
#
# 可选文件——主要用于长篇多角色小说，帮助管理角色出场节奏。
# 追踪文件（outline/追踪/角色统计.yaml）记录实际出场，
# 可在 novel-quality 中做"预期 vs 实际"对比分析。

版本: "1.0"
设计说明: ""                         # 角色出场规划的总体说明

角色出场规划:
  - 角色: ""                         # 角色名
    身份: ""                         # 主角 / 女主 / 重要配角 / 龙套
    所属势力: ""                      # 所属势力/阵营，如"落云宗""鬼道"
    预期出场章数: 0                   # 预期的总出场章节数
    首次出场: ""                      # 计划在哪一章首次出场
    关键章节: []                      # 计划中的关键章节及其事件
    不活跃区间: []                    # 计划中的不活跃区间

  # 示例（使用时可删除）：
  # - 角色: "主角"
  #   身份: "主角"
  #   预期出场章数: 120
  #   首次出场: "第1章"
  #   关键章节:
  #     - "第30章：筑基突破"
  #     - "第80章：结丹"
  #   不活跃区间:
  #     - "第50-60章：支线展开"
  #
  # - 角色: "女主"
  #   身份: "女主"
  #   预期出场章数: 80
  #   首次出场: "第3章"
  #   关键章节:
  #     - "第45章：感情转折"
