style_name: "西方经典文学风"
description: "英语文学经典叙事，简洁克制，心理真实，反讽含蓄"
category: "外国"
dimensions:
  narrative_tone:
    description: "第三人称有限或第一人称，叙述冷静，情感克制，反讽暗藏"
    keywords: ["克制", "反讽", "心理", "旁观"]
  sentence_structure:
    description: "简洁精准，主谓宾干净，少从句嵌套"
    avg_sentence_length: "short"
    characteristics: ["主谓为主", "少从句", "一句一事"]
  pacing:
    description: "关键对话和心理转折场面详写，过渡用叙事概括快进"
    pattern: "场景展现 + 叙事概括交替"
  dialogue_style:
    description: "简短有力，潜台词丰富，极少修饰标签"
    attribution_pattern: "he said / she said 式极简标签"
    speech_patterns: ["简短", "潜台词", "问而不答"]
  vocabulary_register:
    description: "日常口语，精确名词和动词，拒绝抽象形容词"
    register_level: "mixed"
    distinctive_vocab: ["精准动词", "具体名词"]
    forbidden_vocab: ["华丽辞藻", "空洞抒情", "成语堆砌"]
  rhetorical_features:
    description: "明喻精当，象征暗线，冰山理论留白"
    devices: ["明喻", "象征", "对照", "含蓄陈述"]
  forbidden_patterns:
    patterns: ["辞藻堆砌", "直白说教", "大团圆套路", "过度解释"]