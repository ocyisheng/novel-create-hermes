# 伏笔规划模板 v1.0
# outline/伏笔规划.yaml — 创作前：全局伏笔设计总表
# 由 novel-outline 技能在 P5（情节构建）阶段创建和维护
# 包含项目中所有伏笔的完整设计意图，跨情节线
# 是"写前设计"文件，不属于追踪目录
#
# 与追踪文件的区别：
#   - 规划文件（本文件）：结构化设计表，每行一条完整伏笔设计
#   - 追踪文件（outline/追踪/伏笔.yaml）：扁平追加，记录实际埋设/回收事件
#   两者的关系如同建筑设计图（规划）与施工日志（追踪）。

版本: "1.0"
# 可选字段：故事类型、适用阶段等元信息
元信息:
  创建时间: ""
  最后更新: ""
  关联项目: ""

伏笔规划:
  - 编号: "F001"                      # 唯一标识，如 F001, F002
    名称: ""                          # 伏笔名称（必填）
    关联情节线: ""                     # 与哪条情节线相关（引用情节线实体ID）
    设置位置: ""                      # 计划在哪一章/哪段剧情埋下
    描述: |
                                     # 伏笔的内容和设计意图（必填）
                                     # 多段文本用 literal block scalar
    回收位置: ""                      # 计划在哪一章/哪段剧情回收
    预期回收状态: "未设置"             # 未设置 / 已设置 / 已回收（规划中的预期）
    回收描述: ""                      # 预期的回收方式和效果
    涉及角色: []                      # 相关角色列表
    备注: ""                          # 其他需要注意的事项

  # 示例（使用时可删除）：
  # - 编号: "F001"
  #   名称: "绝灵根异常"
  #   关联情节线: "主线"
  #   设置位置: "开篇（主角测试灵根时）"
  #   描述: |
  #     主角的灵根表现异常——金针渡穴竟然成功了。
  #     这不是普通的绝灵根。
  #   回收位置: "人界篇结束（飞升前）"
  #   预期回收状态: "已回收"
  #   回收描述: |
  #     主角确认自己的体质超出人界所有已知范围。
  #   涉及角色: ["主角"]
  #   备注: ""
