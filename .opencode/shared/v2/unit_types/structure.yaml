unit_type: structure
description: "[已废弃] 保留向后兼容。新代码勿用。"

content_schema:
  title:
    type: string
    nullable: true
    description: "结构名称"
  content:
    type: string
    nullable: true
    description: "结构内容"

fact_fields: []

constraints:
  - id: deprecated
    category: boundary
    severity: info
    description: "STRUCTURE 类型已废弃，建议迁移到总纲/部大纲"
    preceding_type: structure
    field: "title"

relations:
  allowed:
    references:
      target_type: ["*"]
      cardinality: any
      description: "引用其他单元"

state_machine:
  initial: sprout
  transitions:
    sprout:  [{ to_status: growing }]
    growing: [{ to_status: mature }]
    mature:  [{ to_status: frozen }]
    frozen:  [{ to_status: growing }]
    archived: []
