# 情节线程模板 v1.0
# 三层结构：_meta + 索引信息 + 摘要 + 完整档案
# 模板结构：索引信息 + 摘要 + 完整档案
# 用于描述主线或支线的完整事件链条

_meta:
  entity_type: "plot_thread"            # 固定值
  schema_version: "3.0"                 # 契约版本
  created_at: ""                        # ISO 时间戳，生成时填写
  updated_at: ""                        # ISO 时间戳，修改时更新

# ═══════════════════════════════════════════
# Layer 1: 索引层 (必填)
# ═══════════════════════════════════════════
索引信息:
  实体ID: ""                            # 如 "main_plot", "revenge_arc"
  名称: ""                              # 显示名，如 "主线", "复仇线"
  类型: "main"                          # main / sub / character_arc
  状态: "active"                        # active / resolved / on_hold
  起始章节: 0                           # 该情节线首次出现的章节号
  起始时间: ""                          # 情节线起点故事时间，如 "致历0年"
  结束时间: ""                          # 情节线终点故事时间，如 "致历约820年"

# ═══════════════════════════════════════════
# Layer 2: 摘要层 (必填)
# 字段名须与 plot_thread_schema.yaml 完全一致
# ═══════════════════════════════════════════
摘要:
  一句话描述: ""                        # ≤30 字，这条情节线是什么
  当前境况: ""                          # ≤50 字，当前所处区间
  核心特质: []                          # ≤5 个关键词
  当前目标: ""                          # 当前区间的情节目标
  关键关系: []                          # 关联的主要角色
  当前区间: ""                          # 如 "拍卖会篇（44-48章）"
  区间情节点: []                        # 当前区间内的关键事件（≤5条）
  关联角色: []                          # 这条情节线涉及的主要角色名

# ═══════════════════════════════════════════
# Layer 3: 完整档案 (创作时填写)
# 完整的事件链条 + 创作指引
# ═══════════════════════════════════════════
完整档案:
  描述: ""                              # 情节线整体描述（100-200字）
  类型: ""                              # 主线 / 支线 / 事件链
  冲突核心: ""                          # 这条线解决什么冲突

  关键事件:                             # 从起始到终局的关键事件
    - 章节: 0
      事件: ""
      影响: ""                          # 对主线或其他支线的影响

  关联支线: []                          # 相关支线的实体ID列表

  终局设计: ""                          # 这条线的结局（可与主线同步或独立收束）

  伏笔清单:
    计划伏笔:                            # 创作前规划：计划埋设的伏笔
      - 编号: ""                         # 伏笔编号，如 "F001"
        描述: ""                         # 伏笔内容简述
    计划回收:                            # 创作前规划：计划回收的伏笔
      - 编号: ""
        描述: ""

  角色参与:
     涉及角色: []                        # 参与这条线的所有角色名
     角色推动作用: ""                    # 角色如何推动这条线
     出场节奏:                           # 角色出场节奏管理（用于 P7/P8）
       - 角色: ""                        # 角色名，与 characters/*.yaml 一致
         首次出场: 0                     # 预期首次出场章节
         关键章节: []                    # 必须出场的章节号，如 [30, 100]
         不活跃区间: []                  # 不应出场的章节区间，如 ["50-60", "120-130"]
         出场密度: "正常"                # 密集/正常/稀疏/仅关键事件

  创作笔记:
    注意事项: []                        # 写这条线容易踩的坑
    节奏提示: ""                        # 这条线的高潮/平缓节奏建议
