unit_type: thematic_motif
description: "主题意象：反复出现的象征性元素"

content_schema:
  motif_name:
    type: string
    required: true
    description: "意象名称"
  description:
    type: string
    required: true
    description: "意象描述"
  occurrences:
    type: array
    nullable: true
    items:
      type: object
      properties:
        chapter:    { type: number, description: "出现章节" }
        context:    { type: string, description: "出现上下文" }
        variation:  { type: string, nullable: true, description: "变体形式" }
    description: "出现记录"
  subtype:
    type: string
    nullable: true
    enum: [贯穿性, 局部性, 装饰性]
    description: "意象覆盖范围"
  motif_symbol:
    type: string
    required: true
    description: "核心象征元素"
  symbolic_meaning:
    type: string
    required: true
    description: "该意象承载的多层含义"
  variation_method:
    type: string
    nullable: true
    description: "意象如何重复并变化"
  occurrence_chapters:
    type: array
    nullable: true
    description: "出现的章节列表"
  related_characters:
    type: array
    nullable: true
    description: "相关角色列表"

subtype:
  field: subtype
  required: false
  options: [贯穿性, 局部性, 装饰性]

fact_fields: []

constraints: []

relations:
  allowed:
    references:
      target_type: [chunk, chapter_plan, scene]
      cardinality: any
      description: "意象出现的章节或场景"
    belongs_to:
      target_type: [outline]
      cardinality: "0..1"
      description: "所属总纲"

state_machine:
  initial: sprout
  transitions:
    sprout:  [{ to_status: growing }]
    growing: [{ to_status: mature }, { to_status: frozen }]
    mature:  [{ to_status: frozen }]
    frozen:  [{ to_status: growing }]
    archived: []
