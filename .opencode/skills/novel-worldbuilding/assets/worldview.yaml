# 世界观模板 v3.0
# 三层结构：_meta + 索引信息 + 摘要 + 完整档案
# 注意：entity_type 应与 实体子类型 保持一致，按实际文件类型赋值

_meta:
  entity_type: ""                           # 与 实体子类型 一致，如 world_overview / rule / power_system / faction / location / history / culture / economic_system / political_system / social_hierarchy
  schema_version: "3.0"                     # 契约版本
  created_at: ""                            # ISO 时间戳，生成时填写
  updated_at: ""                            # ISO 时间戳，修改时更新

# ═══════════════════════════════════════════
# Layer 1: 索引层 (必填)
# ═══════════════════════════════════════════
索引信息:
  实体ID: ""                                # 唯一标识，如 "qi_system", "sword_sect"
  名称: ""                                  # 显示名，如 "灵气淬体体系", "剑阁"
  实体子类型: ""                            # world_overview / rule / power_system / faction / location / history / culture / economic_system / political_system / social_hierarchy
  状态: "active"                            # active / draft / archived

# ═══════════════════════════════════════════
# Layer 2: 摘要层 (必填)
# ═══════════════════════════════════════════
摘要:
  一句话描述: ""                            # ≤30 字，这个实体是什么
  章节关联: []                              # 关联的章节号，如 ["第1章", "第3章"]
  关键词: []                                # ≤5 个关键词

# ═══════════════════════════════════════════
# Layer 3: 完整档案 (按子类型选填相应模块)
# 以下为各子类型的建议字段，Agent 创作时参照
# ═══════════════════════════════════════════
完整档案:
  # ── 子类型: world_overview（世界观概览/基本信息）──
  世界名称: ""
  世界类型: ""                              # 如：玄幻、仙侠、科幻
  时间背景: ""                              # 如：上古/近古/末法
  空间背景: ""                              # 如：九州大陆、星际联邦
  核心设定: ""                              # 一句话概述世界观核心
  一句话概述: ""

  # ── 子类型: rule（世界核心规则）──
  物理法则: ""
  魔法或科技体系: ""
  禁忌与限制: ""
  因果规律: ""
  特殊机制: ""

  # ── 子类型: power_system（力量体系）──
  体系名称: ""
  等级划分:
    - 等级名: ""
      描述: ""
  晋升条件: ""
  力量来源: ""

  # ── 子类型: faction（势力格局）──
  势力列表:
    - 名称: ""
      性质: ""                              # 正派/中立/反派
      核心目标: ""
  势力平衡: ""
  隐藏势力: ""
  冲突焦点: ""

  # ── 子类型: location（地理位置）──
  版图总览: ""
  主要区域:
    - 名称: ""
      位置: ""
      气候: ""
  交通要道: ""
  危险区域: ""
  资源分布: ""

  # ── 子类型: history（历史）──
  纪元划分:
    - 名称: ""
      描述: ""
  重大事件:
    - 名称: ""
      时间: ""
      影响: ""
  传说与秘辛: ""
  历史遗留问题: ""

  # ── 子类型: culture（文化）──
  种族或民族:
    - 名称: ""
      特征: ""
  宗教与信仰:
    - 名称: ""
      教义: ""
  社会结构: ""
  风俗习惯: ""
  语言与文字: ""
  科技或文明水平: ""

  # ── 子类型: economic_system（经济体系）──
  经济体系名称: ""
  货币体系:
    - 货币名称: ""
      价值标准: ""
      发行机构: ""
  经济结构:
    - 主要产业: ""
      占比: ""
      代表势力: ""
  贸易网络:
    - 主要贸易路线: ""
      关键商品: ""
      贸易规则: ""
  资源分配:
    - 资源类型: ""
      分配方式: ""
      控制势力: ""
  经济矛盾:
    - 矛盾点: ""
      影响范围: ""
      解决方案: ""

  # ── 子类型: political_system（政治制度）──
  政治体系名称: ""
  政权结构:
    - 最高权力: ""
      权力机构: ""
      权力制衡: ""
  治理模式:
    - 统治方式: ""
      管理层级: ""
      法律体系: ""
  政治势力:
    - 政党或组织: ""
      政治立场: ""
      影响力: ""
  外交关系:
    - 外交政策: ""
      盟友关系: ""
      敌对关系: ""
  政治冲突:
    - 冲突类型: ""
      涉及方: ""
      影响程度: ""

  # ── 子类型: social_hierarchy（社会阶层）──
  社会体系名称: ""
  阶层划分:
    - 阶层名称: ""
      权力等级: ""
      人口比例: ""
      特权: ""
      义务: ""
  流动机制:
    - 上升途径: ""
      下降原因: ""
      流动难度: ""
  社会矛盾:
    - 矛盾类型: ""
      涉及阶层: ""
      激化因素: ""
      缓解机制: ""
  文化认同:
    - 阶层文化: ""
      价值观念: ""
      行为规范: ""

  # ── 创作笔记 ──
  注意事项: ""
  扩展建议: ""
