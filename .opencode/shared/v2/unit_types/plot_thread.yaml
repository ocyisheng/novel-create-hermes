unit_type: plot_thread
description: "情节线：一条完整的故事脉络"

subtype:
  field: type
  required: true
  options: [主线, 支线, 暗线, 感情线, 成长线, 世界观线]

content_schema:
  type:
    type: string
    required: true
    enum: [主线, 支线, 暗线, 感情线, 成长线, 世界观线]
    description: "情节线分类"
  summary:
    type: string
    nullable: true
    description: "情节概要"
  conflict:
    type: string
    nullable: true
    description: "核心冲突"
  resolution:
    type: string
    nullable: true
    description: "解决方式"
  story_arc:
    type: string
    nullable: true
    description: "故事弧线（三幕/五幕/七幕等）"
  core_conflict:
    type: string
    required: true
    description: "核心冲突"
  key_events:
    type: array
    nullable: true
    description: "关键事件序列"
    items:
      type: object
      properties:
        chapter_number:
          type: number
          description: "事件发生章节"
        event:
          type: string
          description: "事件描述"
  ending_design:
    type: string
    nullable: true
    description: "情节线的终局设计"

fact_fields: []

constraints:
  - id: has_chapters
    category: cardinality
    severity: warning
    description: "情节线至少应有关联的 scene 或 chapter_plan"
    relation_type: "plans"
    min_count: 1
    target_type: [scene, chapter_plan]

relations:
  allowed:
    plans:
      target_type: [scene, chapter_plan]
      cardinality: "1+"
      description: "情节线规划的场景或章纲"
      payload_schema:
        weight:
          type: number
          nullable: true
          description: "该节点在此情线中的重要性权重（0.0-1.0）"
        phase:
          type: string
          nullable: true
          enum: ["setup", "rising", "climax", "falling", "resolution"]
          description: "该节点在情节线中所处的阶段"
        sub_plot_label:
          type: string
          nullable: true
          description: "子情节标签，用于区分同一情节线下的多条支线"
        expected_length:
          type: number
          nullable: true
          description: "预期字数"
      payload_constraints:
        - id: plans_phase_valid
          category: boundary
          severity: info
          description: "如果填写了阶段，必须是合法值之一"
          fields: ["phase"]
          check: field_not_null
    causes:
      target_type: [plot_thread]
      cardinality: any
      description: "因果关系的情节线"
    references:
      target_type: [character_arc, world_rule]
      cardinality: any
      description: "情节线涉及的角色或设定"
    belongs_to:
      target_type: [arc_plan, outline]
      cardinality: "0..1"
      description: "所属的部大纲或总纲"

state_machine:
  initial: sprout
  transitions:
    sprout:  [{ to_status: growing }]
    growing: [{ to_status: mature }, { to_status: frozen }]
    mature:  [{ to_status: growing }, { to_status: frozen }]
    frozen:  [{ to_status: growing }]
    archived: []
