unit_type: world_rule
description: "世界观规则：世界运行的核心法则"

subtype:
  field: sub_type
  alt_fields: []
  required: true
  options: [世界观总览, 规则, 力量体系, 势力, 地点, 历史, 文化, 经济体系, 政治体系, 社会阶层, 纪年事件]
  value_labels:
    地点: location
    势力: faction
    规则: rule
    力量体系: power_system
    纪年事件: chronicle_event
  value_colors:
    地点: { bg: "rgba(0,176,240,0.2)", text: "#5BD" }
    势力: { bg: "rgba(237,125,49,0.2)", text: "#ED7D31" }
    纪年事件: { bg: "rgba(180,167,214,0.2)", text: "#8E7CC3" }
  behaviors:
    纪年事件:
      type: timeline_event
      time_field: "时间"
      event_field: "事件"

content_schema:
  sub_type:
    type: string
    required: true
    enum: [世界观总览, 规则, 力量体系, 势力, 地点, 历史, 文化, 经济体系, 政治体系, 社会阶层, 纪年事件]
    description: "规则子类型"
  description:
    type: string
    description: "规则描述"
  hierarchy:
    type: string
    nullable: true
    description: "层级定位（如'下位宗门'）"
  power_level:
    type: string
    nullable: true
    description: "力量层级"
  sub_type_detail:
    type: string
    nullable: true
    description: "子类型的细化分类"
  event_location:
    type: string
    nullable: true
    description: "事件发生的地理位置（纪年事件推荐填写）"
  event_volume:
    type: number
    nullable: true
    description: "事件发生的卷号（纪年事件推荐填写）"

fact_fields:
  - name: "hierarchy_ref"
    path: "hierarchy"
    type: entity_reference
    target_type: world_rule
    match_field: unit_name
    description: "层级归属引用"

constraints:
  - id: sub_type_required
    category: boundary
    severity: info
    description: "world_rule 最好有子类型分类"
    preceding_type: world_rule
    field: "sub_type"

  - id: control_cycle
    category: pattern
    severity: warning
    description: "势力控制关系形成环路"
    params:
      match:
        mode: cycle
        edge_type: controls
        direction: outgoing
        max_depth: 10

relations:
  allowed:
    belongs_to:
      target_type: [world_rule]
      cardinality: "0..1"
      description: "层级归属（如宗门所属地域）"
    contains:
      target_type: [world_rule]
      cardinality: "0..n"
      description: "包含的子规则"
      auto_label:
        都城:
          keywords: ["都城", "王都", "皇城", "主城", "总部", "总坛", "圣地"]
        属城:
          keywords: ["属城", "卫城", "下辖", "分支", "分坛", "据点", "别府"]
        辖区:
          keywords: ["辖区", "领地", "封地", "疆域", "辖境", "地界"]
    located_at:
      target_type: [world_rule]
      cardinality: "0..1"
      description: "地理位置归属"
    controls:
      target_type: [world_rule]
      cardinality: any
      description: "控制关系（势力控制地域）"
      auto_label:
        附庸:
          keywords: ["附庸", "臣服", "进贡", "属国", "藩属", "朝贡", "归顺"]
        同盟:
          keywords: ["同盟", "盟约", "联盟", "结盟", "盟军", "友邦", "协约"]
        敌对:
          keywords: ["敌对", "仇视", "对立", "交战", "征讨", "讨伐"]
    relates_to:
      target_type: [world_rule]
      cardinality: any
      bidirectional: true
      description: "关联关系"
    member_of:
      target_type: [character_arc]
      cardinality: any
      description: "角色所属此规则"

state_machine:
  initial: sprout
  transitions:
    sprout:  [{ to_status: growing }]
    growing: [{ to_status: mature }, { to_status: frozen }]
    mature:  [{ to_status: growing }, { to_status: frozen }]
    frozen:  [{ to_status: growing }]
    archived: []
