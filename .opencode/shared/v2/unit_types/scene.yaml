unit_type: scene
description: "场景：一个时间×地点×人物组的叙事切片"

subtype:
  field: subtype
  required: true
  options: [开篇, 推进, 冲突, 转折, 展示, 过渡, 收束]

content_schema:
  synopsis:
    type: string
    required: true
    description: "场景概要"
  mood:
    type: string
    nullable: true
    description: "场景基调"
  pacing:
    type: string
    nullable: true
    enum: ["fast", "medium", "slow"]
    description: "叙事节奏"
  location:
    type: string
    nullable: true
    required: true
    description: "场景地点"
  time_label:
    type: string
    nullable: true
    description: "时间标签（如'第三日清晨'）"
  subtype:
    type: string
    required: true
    enum: [开篇, 推进, 冲突, 转折, 展示, 过渡, 收束]
    description: "场景子类型"
  pov_character:
    type: string
    required: true
    description: "视角角色名"
  time_text:
    type: string
    nullable: true
    description: "人类可读时间表达，如'第三日黄昏'"
  time_ordinal:
    type: number
    nullable: true
    description: "故事时间坐标"
  one_line_summary:
    type: string
    required: true
    description: "场景一句话概要"
  cast:
    type: array
    nullable: true
    description: "参与本场景的角色列表"
    items:
      type: object
      properties:
        name:
          type: string
          required: true
          description: "角色名称"
        role_status:
          type: string
          nullable: true
          description: "角色在该场景的状态"
        role_in_scene:
          type: string
          nullable: true
          description: "角色在本场景的叙事功能"
        chapter_end_state:
          type: object
          nullable: true
          description: "角色在本章结束时的状态"
  related_plotlines:
    type: array
    nullable: true
    description: "关联的情节线列表"

fact_fields:
  - name: "location_ref"
    path: "location"
    type: entity_reference
    target_type: world_rule
    match_field: unit_name
    rel_type: located_at
    description: "场景地点引用"

constraints:
  - id: has_participants
    category: cardinality
    severity: info
    description: "场景至少应有一个角色参与"
    relation_type: "participates_in"
    min_count: 1
    target_type: [character_arc]

  - id: location_exists
    category: referential_integrity
    severity: info
    description: "场景地点应在 world_rule 中有对应条目"
    fact_field: "location_ref"

relations:
  allowed:
    participates_in:
      target_type: [character_arc]
      cardinality: "1+"
      bidirectional: true
      description: "参与该场景的角色"
      payload_schema:
        role:
          type: string
          nullable: true
          description: "角色在该场景中的戏份定位"
        entrance:
          type: string
          nullable: true
          description: "入场方式描述"
        exit:
          type: string
          nullable: true
          description: "退场方式描述"
        screen_time:
          type: number
          nullable: true
          description: "戏份权重（0.0-1.0）"
        appearance_order:
          type: number
          nullable: true
          description: "出场顺序"
    located_at:
      target_type: [world_rule]
      cardinality: "0..1"
      description: "场景发生地点"
      payload_schema:
        position_desc:
          type: string
          nullable: true
          description: "在该地点中的具体位置描述"
        sub_location:
          type: string
          nullable: true
          description: "子地点（如'城主府·后花园'）"
        weather:
          type: string
          nullable: true
          description: "该场景的天气设定"
    planned_by:
      target_type: [chapter_plan, plot_thread]
      cardinality: any
      description: "规划该场景的章纲/情节线"
    precedes:
      target_type: [scene]
      cardinality: any
      description: "时间线前驱场景"

state_machine:
  initial: sprout
  transitions:
    sprout:  [{ to_status: growing }]
    growing: [{ to_status: mature }, { to_status: frozen }]
    mature:  [{ to_status: growing }, { to_status: frozen }]
    frozen:  [{ to_status: growing }]
    archived: []
