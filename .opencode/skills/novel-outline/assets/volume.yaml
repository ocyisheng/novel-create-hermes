# 分卷模板 v1.0
# 单卷故事上下文 — 元文档，不参与三层索引
# 无需 _meta/索引信息/摘要（非实体，Agent 手动 read）

# ═══════════════════════════════════════════
# 一、卷基本信息
# ═══════════════════════════════════════════
分卷名称: ""                            # 如 "开端", "风云际会", "终局"
卷号: 0                                 # 如 1, 2, 3
章节范围: ""                            # 如 "第1章 - 第30章"

# ═══════════════════════════════════════════
# 二、卷概要
# ═══════════════════════════════════════════
概要: ""                                # 100-200字，这一卷讲什么

# ═══════════════════════════════════════════
# 三、核心问题
# ═══════════════════════════════════════════
核心问题: ""                            # 这一卷要解决/回答的核心问题
                                        # 例: "主角能否通过入门试炼"
                                        #     "拍卖会上谁会得到那件宝物"

# ═══════════════════════════════════════════
# 四、关键情节点
# ═══════════════════════════════════════════
关键情节点:                             # 这一卷最重要的情节节点（5-10个）
  - 节点: ""
    涉及章节: ""                        # 如 "第5章"
    角色: []                            # 涉及的主要角色
    影响: ""                            # 对后续剧情的影响

# ═══════════════════════════════════════════
# 五、角色发展
# ═══════════════════════════════════════════
卷内角色发展:
  主角:
    起始状态: ""                        # 卷初主角的状态/等级/心境
    目标: ""                            # 本卷中主角追求什么
    障碍: []                            # 本卷中阻挠主角的力量
    成长: ""                            # 卷末主角获得了什么成长
    卷终状态: ""                        # 卷末主角的状态
  重要配角:                             # 本卷有重要发展的配角
    - 角色名: ""
      起始状态: ""
      卷内发展: ""
      卷终状态: ""

# ═══════════════════════════════════════════
# 六、卷内势力/世界观变动
# ═══════════════════════════════════════════
势力变动:                               # 本卷中势力格局的变化
  - 势力名: ""
    变化: ""                            # 壮大/削弱/重组/消失
    原因: ""

世界观揭示: []                          # 本卷中新揭示的世界规则或秘密

# ═══════════════════════════════════════════
# 七、写作提示
# ═══════════════════════════════════════════
本卷容易踩的坑: []
与其他卷的衔接注意: ""
