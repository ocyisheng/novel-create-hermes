# 章节分纲模板 v3.0.0
# 三层结构：_meta + 索引信息 + 摘要 + 完整档案
# 模板结构：索引信息 + 摘要 + 完整档案
# Agent 创建分纲时以此为模板，update_index.py 自动索引

_meta:
  entity_type: "chapter"                # 固定值
  schema_version: "3.0"                 # 契约版本
  created_at: ""                        # ISO 时间戳，生成时填写
  updated_at: ""                        # ISO 时间戳，修改时更新

# ═══════════════════════════════════════════
# Layer 1: 索引层 (必填)
# update_index.py 自动提取到 project_index.yaml
# ═══════════════════════════════════════════
索引信息:
  实体ID: ""                            # 如 "chapter_46"，用于索引键
  名称: ""                              # 显示名，如 "第46章"
  章节号: 0                             # 章节序号
  所属分卷: 0                           # 所在卷号
  状态: "draft"                         # draft / writing / complete
  字数: 0                               # 生成后填入

# ═══════════════════════════════════════════
# Layer 2: 摘要层 (必填)
# update_index.py 自动生成到 {实体ID}.summary.yaml
# context_loadout.py 从此层读取出场角色和核心情节点
# ═══════════════════════════════════════════
摘要:
  一句话描述: ""                        # ≤30 字，本章讲什么
  当前境况: ""                          # ≤50 字，本章在情节中的位置
  核心特质: []                          # ≤5 个关键词
  当前目标: ""                          # 本章的叙事目标
  关键关系: []                          # 本章涉及的关键角色关系
  出场角色: []                          # 本章出场角色名列表
  核心情节点: []                        # 本章关键情节点（≤5条）
  关键转折: false                       # 是否为关键转折章节

# ═══════════════════════════════════════════
# Layer 3: 完整档案 (创作时填写)
# 原 chapter.yaml v2.0.0 的详细内容保留在此
# Agent 深度分析或重写时按需 read
# ═══════════════════════════════════════════
完整档案:
  基本信息:
    章节名: ""
    类型: "推进"                        # 推进/过渡/高潮/结局/转折/收尾
    字数目标: 3000
    实际字数: 0

  结构规划:
    开篇:
      方式: ""                          # 场景切入/悬念/回忆
      上章衔接: ""
    发展:
      核心冲突: ""
      推进: ""
    转折:
      事件: ""
    收尾:
      结果: ""
      下章铺垫: ""

  情节点:
    - 场景: ""
      人物: []

  出场角色:
    - 角色名: ""
      状态: ""
      场景作用: ""                      # 推动情节/展示性格/情感表达

  伏笔处理:
    回收伏笔: []
    新设伏笔: []
    延续伏笔: []

  时间线事件:
    - 事件ID: ""
      时间点: ""
      事件描述: ""

  涉及地点: []

  情感节奏:
    情感基调: ""
    高潮点: ""

  世界观补充:
    - 元素类型: ""                      # 地点/规则/文化/技术
      内容描述: ""

  写作笔记:
    注意事项: ""
