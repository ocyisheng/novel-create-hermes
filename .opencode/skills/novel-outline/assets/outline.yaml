# 总纲模板 v2.0
# 故事全局骨架 — 元文档，不参与三层索引
# 无需 _meta/索引信息/摘要（非实体，Agent 手动 read）
#
# v2.0 变更：`三幕结构:` 改为动态 `故事结构:` 列表格式，
# 支持三幕/五幕/自定义幕数，卷数由 config.yaml 的 `结构配置` 决定。

# ═══════════════════════════════════════════
# 一、基本信息
# ═══════════════════════════════════════════
项目名称: ""
类型: ""                                # 玄幻/都市/科幻/悬疑/仙侠/武侠/历史/言情/奇幻/其他
目标字数: 0
预计章节数: 0
目标读者: ""                            # 男频/女频/混合
故事时间范围: ""                        # 全局时间跨度，如 "致历-3200年 至 致历约7800年"
时间体系: ""                            # 故事世界的纪年体系名称，如 "致历" / "公元" / "星历"

# ═══════════════════════════════════════════
# 二、核心概念
# ═══════════════════════════════════════════
核心概念:
  一句话概述: ""                        # ≤30 字，整本书的核心卖点
  核心卖点: ""                          # 吸引读者的核心亮点
  主题关键词: []                        # 如 ["成长", "复仇", "探案"]
  主题:
    核心: ""                            # 核心主题表达
    呈现: ""                            # 主题如何通过情节呈现

# ═══════════════════════════════════════════
# 三、人物与世界的关系
# ═══════════════════════════════════════════
人物与世界:
  主角与世界的关系: ""                  # 主角如何进入/身处这个世界
                                         # 例: "生于此世的废柴少年"
                                         #     "魂穿异界的现代人"  
                                         #     "带记忆重生的复仇者"
                                         #     "失忆后发现自己身份不凡"
  主角的特殊性: ""                      # 与这个世界其他人相比，主角有什么不同
                                         # 例: "唯一拥有双灵根的人"
                                         #     "前世记忆成为最大优势"
  世界规则对主角的约束: []              # 世界的什么规则限制了主角
  主角打破/利用世界规则的方式: ""        # 主角如何突破规则
  初始境况: ""                          # 故事开始时主角的处境

# ═══════════════════════════════════════════
# 四、故事结构（动态幕数）
# ═══════════════════════════════════════════
# 结构类型和幕数由 config.yaml 的 `结构配置` 确定。
# 示例：
#   三幕：[开端, 发展, 高潮结局]        章节分布 [25, 50, 25]
#   五幕：[建置, 上升, 高潮, 下降, 结局] 章节分布 [15, 25, 20, 15, 25]
#   自定义N幕：[第1幕, 第2幕, ..., 第N幕]
# 写入时根据项目实际结构，将以下列表展开为对应数量的条目。
故事结构:
  结构类型: "三幕"                       # 三幕 / 五幕 / 自定义
  幕:
    - 幕号: 1
      名称: "开端"                      # 根据结构类型自动填充默认名称
      章节范围: "第1章 - 第30章"        # 自动按章节分布计算
      主线: ""                          # 本幕核心故事线
      关键节点: []
      主角状态: ""                      # 本幕结束时主角的变化
    - 幕号: 2
      名称: "发展"
      章节范围: "第31章 - 第70章"
      主线: ""
      关键节点: []
      主角状态: ""
    - 幕号: 3
      名称: "高潮结局"
      章节范围: "第71章 - 第100章"
      主线: ""
      关键节点: []
      主角状态: ""

# ═══════════════════════════════════════════
# 五、分卷概览
# ═══════════════════════════════════════════
# 卷数由 config.yaml 的 `结构配置.卷数` 决定。
# 下方为示例，实际写入时应展开为对应数量的条目。
分卷:
  - 卷号: 1
    卷名: ""                            # 如"开端"
    章节范围: ""                        # 如"第1章 - 第30章"
    核心问题: ""                        # 这一卷解决什么核心问题
    主角转变: ""                        # 这一卷结束后主角的成长
  - 卷号: 2
    卷名: ""
    章节范围: ""
    核心问题: ""
    主角转变: ""

# ═══════════════════════════════════════════
# 六、节奏与结局
# ═══════════════════════════════════════════
节奏:
  前期基调: ""                          # 舒缓/紧凑/悬疑
  中期基调: ""                          # 过渡/爆发
  后期基调: ""                          # 高潮/收束
  章节分布: [25, 50, 25]               # 各幕的章节百分比，与幕数对应

结局类型: ""                            # 开放式/圆满/悲壮/反转
结局设计: ""                            # 结局的核心设计思路
