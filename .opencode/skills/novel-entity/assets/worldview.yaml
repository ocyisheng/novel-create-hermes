# 世界观模板 v1.0
# 三层结构：_meta + 索引信息 + 摘要 + 完整档案
# 模板结构：索引信息 + 摘要 + 完整档案
# 注意：一个 worldbuilding 文件描述一个具体实体（如一种力量体系、一个势力）；
#       如需整体世界观概览，使用单独的 基本信息.yaml

_meta:
  entity_type: "worldbuilding"          # 固定值（NOT "worldview"）
  schema_version: "1.0"                 # 契约版本
  created_at: ""                        # ISO 时间戳，生成时填写
  updated_at: ""                        # ISO 时间戳，修改时更新

# ═══════════════════════════════════════════
# Layer 1: 索引层 (必填)
# ═══════════════════════════════════════════
索引信息:
  实体ID: ""                            # 唯一标识，如 "qi_system", "sword_sect"
  名称: ""                              # 显示名，如 "灵气淬体体系", "剑阁"
  实体子类型: ""                        # location / faction / rule / power_system / history / culture / world_overview
  状态: "active"                        # active / draft / archived

# ═══════════════════════════════════════════
# Layer 2: 摘要层 (必填)
# 字段名须与 worldbuilding_schema.yaml 完全一致
# ═══════════════════════════════════════════
摘要:
  一句话描述: ""                        # ≤30 字，这个实体是什么
  章节关联: []                          # 与此实体相关的主要章节号
  关键词: []                            # ≤5 个关键词

# ═══════════════════════════════════════════
# Layer 3: 完整档案 (按子类型选填相应模块)
# 以下为各子类型的建议字段，Agent 创作时参照
# ═══════════════════════════════════════════
完整档案:
  # ── 子类型: world_overview（世界观概览）──
  世界名称: ""
  时代背景: ""
  核心设定: ""                          # 一句话概述

  # ── 子类型: rule（世界规则）──
  物理法则: ""
  禁忌与限制: []
  因果规律: ""

  # ── 子类型: power_system（力量体系）──
  体系名称: ""
  等级划分:
    - 等级名: ""
      描述: ""
  力量来源: ""

  # ── 子类型: faction（势力）──
  势力名称: ""
  领袖: ""
  性质: ""                              # 正派/中立/反派
  核心目标: ""
  势力平衡: ""

  # ── 子类型: location（地理位置）──
  地点名称: ""
  区域描述: ""
  气候: ""
  交通要道: ""
  危险区域: ""

  # ── 子类型: history（历史）──
  纪元划分:
    - 名称: ""
      描述: ""
  重大事件:
    - 名称: ""
      时间: ""
      影响: ""

  # ── 子类型: culture（文化）──
  种族或民族:
    - 名称: ""
      特征: ""
  宗教与信仰: []
  社会结构: ""
  风俗习惯: []

  # ── 创作笔记 ──
  注意事项: ""
  扩展建议: ""
