# =============================================================================
# 默认叙事约束定义
# =============================================================================
# 本文件定义项目级别的默认约束。每个 V2 项目可在自己的
# .opencode/constraints.yaml 中覆盖或扩展。
#
# 约束类别：
#   referential_integrity — 引用完整性（引用的东西必须存在）
#   temporal             — 时序约束（有序量必须单调递增）
#   relational           — 关系约束（关系网络结构性质）
#   boundary             — 边界约束（相邻单元开端/结尾匹配）
#   state_conservation   — 状态守恒（状态变更需有对应事件）
#   pattern              — 模式检测（LLM 辅助的信号检测）
#
# 严重度：
#   error   — 确定是问题，应提示用户
#   warning — 可能是问题，需人工判断
#   info    — 仅供参考

constraints:
  # ── 引用完整性 ─────────────────────────────────────────────────────

  - category: referential_integrity
    id: RI01
    severity: warning
    description: "角色事件表中的位置必须在 world_rule 中有对应条目"
    enabled: true
    params:
      source_type: "character_arc"
      extract_field: "events[].location"
      target_type: "world_rule"
      match_field: "unit_name"

  - category: referential_integrity
    id: RI02
    severity: info
    description: "章纲中引用的场景 ID 应在 graph 中有对应 scene 节点"
    enabled: true
    params:
      source_type: "chapter_plan"
      extract_field: "scenes[].scene_id"
      target_type: "scene"
      match_field: "id"

  # ── 时序约束 ───────────────────────────────────────────────────────

  - category: temporal
    id: T01
    severity: warning
    description: "角色年龄必须随事件序数单调递增"
    enabled: true
    params:
      source_type: "character_arc"
      extract_field: "events[].age"
      ordering_field: "events[].ordinal"
      monotonic: "increasing"
      exception_field: "events[].type"
      exception_values: ["废功", "散功", "转世"]

  - category: temporal
    id: T02
    severity: warning
    description: "角色修为等级应随序数递增（除非有废功事件标注）"
    enabled: true
    params:
      source_type: "character_arc"
      extract_field: "events[].realm"
      ordering_field: "events[].ordinal"
      monotonic: "increasing"
      exception_field: "events[].type"
      exception_values: ["废功", "散功", "转世"]

  # ── 关系约束 ───────────────────────────────────────────────────────

  - category: relational
    id: REL01
    severity: info
    description: "PARTICIPATES_IN 关系应双向一致"
    enabled: true
    params:
      relation_type: "participates_in"
      check: "bidirectional"

  - category: relational
    id: REL02
    severity: warning
    description: "情节线至少应有 scene 或 chapter_plan 关联"
    enabled: true
    params:
      relation_type: "plans"
      check: "cardinality_min"
      source_type: "plot_thread"
      target_type: ["scene", "chapter_plan"]
      min_count: 1

  # ── 边界约束 ───────────────────────────────────────────────────────

  - category: boundary
    id: B01
    severity: warning
    description: "卷末尾章纲的终点状态应与下一卷开场设定一致"
    enabled: true
    params:
      preceding_type: "chapter_plan"
      following_relation: "PRECEDES"
      extract_field: "end_state"

  # ── 状态守恒 ───────────────────────────────────────────────────────

  - category: state_conservation
    id: S01
    severity: warning
    description: "已归档角色不应继续通过 PARTICIPATES_IN 出现在场景中"
    enabled: true
    params:
      entity_type: "character_arc"
      state_field: "status"
      forbidden_relation: "participates_in"
      allowed_exception_values: ["flashback", "回忆", "梦境"]
