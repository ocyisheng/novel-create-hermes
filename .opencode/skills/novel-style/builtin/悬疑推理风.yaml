style_name: "悬疑推理风"
description: "悬疑推理叙事，线索密织，气氛紧绷，逻辑为骨，反转迭出"
category: "通用"
dimensions:
  narrative_tone:
    description: "第三人称有限或第一人称，信息刻意隐藏，气氛压抑紧张"
    keywords: ["悬疑", "紧张", "暗线", "反转"]
  sentence_structure:
    description: "短句为主，节奏越来越快，关键时刻一句一段"
    avg_sentence_length: "short"
    characteristics: ["短句加速", "一句一段", "留白悬念"]
  pacing:
    description: "线索发现时放慢精描，追凶搏斗加快节奏，反转处急停"
    pattern: "线索埋设 → 紧张追逐 → 反转急停 → 真相复盘"
  dialogue_style:
    description: "审讯对话层层递进，每一句话都可能是线索或误导"
    attribution_pattern: "沉声道、低声道营造紧张气氛"
    speech_patterns: ["层层递进", "线索式", "误导性"]
  vocabulary_register:
    description: "精准口语，法医学/侦查术语自然嵌入"
    register_level: "mixed"
    distinctive_vocab: ["线索", "嫌疑人", "不在场证明", "动机"]
    forbidden_vocab: ["过早亮底牌", "随意解释", "散漫叙事"]
  rhetorical_features:
    description: "伏笔、误导、反转、对照"
    devices: ["伏笔", "对照", "暗示", "反转"]
  forbidden_patterns:
    patterns: ["平铺直叙", "上帝视角全知", "无逻辑的巧合"]