# 创作需求发现报告模板
# 输出路径: quality/grill/{测试阶段}_需求_{YYYYMMDD_HHmmss}.yaml

项目名: "{项目名}"
阶段: "{测试阶段}"  # ideation / character / chapter
模式: discovery
时间: "{时间戳}"

需求清单:
  # 每分支的确认结论
  类型与基调:
    - "用户选择：..."
  # ...

关键需求:
  - "用户明确表达的关键约束或偏好"

排除项:
  - "用户排除或不要的方向"

注入指令: >-
  将以上需求作为 task() 的 CONTEXT 输入，
  要求生成结果必须符合上述用户确认的所有条件。
