style_name: "古龙武侠风"
description: "古龙式极简武侠，意境先行，留白断句，哲思对话，冷峻浪漫"
category: "武侠"
dimensions:
  narrative_tone:
    description: "冷峻旁观，偶尔如诗如哲的旁白跳出，孤独感贯穿"
    keywords: ["冷峻", "孤独", "诗意", "哲理"]
  sentence_structure:
    description: "极端短句，独句成段极多，断句如刀"
    avg_sentence_length: "short"
    characteristics: ["独句成段", "断句如刀", "留白大段"]
  pacing:
    description: "决斗前蓄势极长（气氛/眼神/一句话），出招瞬间结束"
    pattern: "无限蓄势 → 一击毙命 → 余韵回荡"
  dialogue_style:
    description: "短促有力，一问一答如对刀，话中藏玄机"
    attribution_pattern: "极少标签，几乎全部纯对话压上"
    speech_patterns: ["短促", "哲理", "对刀式", "反问"]
  vocabulary_register:
    description: "口语为主，抽象哲思词点缀，精准如匕首"
    register_level: "colloquial"
    distinctive_vocab: ["寂寞", "风雨", "夜色", "酒", "刀"]
    forbidden_vocab: ["招式名罗列", "等级体系", "修饰堆砌"]
  rhetorical_features:
    description: "比喻精短（一个意象即止），排比悲怆，反复追问"
    devices: ["短喻", "重复", "反问", "留白"]
  forbidden_patterns:
    patterns: ["冗长打斗描写", "等级分明体系", "说教式表达"]