style_name: "经典男频风"
description: "男频升级流叙事，修炼突破、装逼打脸、碾压对手为核心爽点，节奏紧致不拖沓"
category: "网文"
dimensions:
  narrative_tone:
    description: "第三人称有限，冷静克制，偶尔骚话吐槽，爽点密集"
    keywords: ["克制", "爽感", "打脸"]
    example: "他冷笑一声。蝼蚁而已。"
  sentence_structure:
    description: "短句为主，对话+动作交替推进，段落短小"
    avg_sentence_length: "short"
    characteristics: ["短句", "对话密集", "段落短"]
    example: "一拳轰出。空间碎裂。对手倒飞。"
  pacing:
    description: "装逼打脸快节奏，升级突破做慢镜头，日常过渡简写"
    pattern: "冲突 → 打脸 → 收获 → 升级循环"
    example: "【装逼】反派嘲讽（2-3句）→【打脸】主角一招制敌（1-2句）→【收获】获取宝物（1句）"
  dialogue_style:
    description: "干脆利落，少修饰，对话驱动情节"
    attribution_pattern: "极少标签，说、道、沉声道"
    speech_patterns: ["干脆", "不废话", "偶尔中二"]
    example: "就这？你很强？不过如此。"
  vocabulary_register:
    description: "口语为主，修炼术语精准，少成语堆砌"
    register_level: "colloquial"
    distinctive_vocab: ["灵压", "碾压", "逆天", "蝼蚁"]
    forbidden_vocab: ["文艺腔长句", "女频式情感渲染"]
  rhetorical_features:
    description: "少修辞，强调实力对比和反差爽感"
    devices: ["对比", "夸张"]
  forbidden_patterns:
    patterns: ["长篇心理描写", "缠绵感情戏", "拖沓过渡"]